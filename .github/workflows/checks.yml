name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m pip check
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt .
      - name: Fetch verified Blender 5.2.0
        shell: bash
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz --output "$RUNNER_TEMP/blender.tar.xz"
          echo "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Check generated geometry through the installed package
        run: python tools/verify_geometry.py --blender-exe "$RUNNER_TEMP/blender-5.2.0-linux-x64/blender" --output verification-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-results
          path: |
            verification-output/*.json
            verification-output/**/*.json
            verification-output/**/*.log
