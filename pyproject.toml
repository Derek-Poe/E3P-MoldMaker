[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "e3p-moldmaker"
version = "0.2.0"
description = "Blender mold generation with validated geometry and a Cura extension"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Derek Poe"}]
dependencies = ["numpy>=2.5,<3", "trimesh>=5.1,<6"]

[project.scripts]
e3p-mold = "e3p_mold.cli:main"

[project.urls]
Repository = "https://github.com/Derek-Poe/E3P-MoldMaker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
e3p_mold = ["blender/*.py"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/e3p_mold/blender/generate.py" = ["E402"]
